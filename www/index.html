let state = null;

function newGame(){
  state = {
    phase:'intro', // intro -> cutting -> playing -> gameover
    deck: createDeck(),
    table: [], // items: {type:'card', card} or {type:'build', targetValue, cards:[], owner}
    players: [
      {id:0, name:'You', hand:[], captured:[]},
      {id:1, name:'Rival', hand:[], captured:[]}
    ],
    active: [0,1], // seats still in play — always both, outside Tournament mode
    turn:0,
    lastCapturer:null,
    log:'Shuffling Cards...',
    selHand:null, // index into current player's hand
    selTable:new Set(), // indices into table array
    selCaptured:new Set(), // keys "ownerIdx_cardIdx" into players[owner].captured — cards raided from a captured pile
    forcedCapture:null, // {owner, buildRef} — a build its owner must capture this turn or lose
    rulesOpen:false,
    cuttingAnim:false // true while the cut animation is playing, before the deck actually splits
  };
  shuffle(state.deck);
  render();
}

function doCut(){
  if(state.cuttingAnim) return; // already animating — ignore extra taps
  state.cuttingAnim = true;
  render(); // shows the split-pile animation and disables further taps
  setTimeout(()=>{
    state.deck = cutDeck(state.deck);
    state.phase='playing';
    state.cuttingAnim = false;
    dealInitial();
    state.log = net.active ? 'Cards dealt. The player who created the room goes first.' : 'Cards dealt. You go first — select a card from your hand.';
    render();
  }, 700); // matches the .deck-tap.cutting animation duration below
}

function dealInitial(){
  const seats = state.active || [0,1];
  for(let i=0;i<4;i++) state.table.push({type:'card', card:state.deck.pop()});
  for(let i=0;i<4;i++){
    seats.forEach(seat=>{ if(state.deck.length>0) state.players[seat].hand.push(state.deck.pop()); });
  }
}
function dealMoreIfNeeded(){
  // A round ends only once EVERY seat still in play has emptied its hand.
  // At that point, if cards remain undrawn, deal a fresh 4 to each seat
  // for the next round. This repeats until the deck is exhausted.
  const seats = state.active || [0,1];
  if(seats.every(seat=>state.players[seat].hand.length===0)){
    if(state.deck.length>0){
      for(let i=0;i<4;i++){
        seats.forEach(seat=>{ if(state.deck.length>0) state.players[seat].hand.push(state.deck.pop()); });
      }
      state.log = `New round — 4 cards dealt to each player. ${state.log}`;
      speak('New round dealt');
    } else {
      if(state.tournament) tEndRound(); else endGame();
    }
  }
}

/* ============ VALIDATION ============ */
function getAllSubsets(items){
  const res=[];
  const n=items.length;
  for(let mask=1; mask<(1<<n); mask++){
    const subset=[];
    for(let i=0;i<n;i++) if(mask & (1<<i)) subset.push(items[i]);
    res.push(subset);
  }
  return res;
}

// Resolves a human/UI selection (table indices + "ownerIdx_cardIdx" captured-pile
// keys) into a flat list of generic pool items, each carrying its own sum value.
function resolveSelection(selTableIdxArr, selCapturedKeysArr){
  const items = [];
  let hasBuild = false;
  selTableIdxArr.forEach(idx=>{
    const it = state.table[idx];
    if(it.type==='card'){
      items.push({kind:'tableCard', idx, value: sumValue(it.card), rank: it.card.rank, card: it.card});
    } else {
      hasBuild = true;
      items.push({kind:'tableBuild', idx, value: it.targetValue, rank: it.targetRank||null, cards: it.cards});
    }
  });
  (selCapturedKeysArr||[]).forEach(key=>{
    const [owner, idx] = key.split('_').map(Number);
    const card = state.players[owner].captured[idx];
    items.push({kind:'captured', owner, idx, value: sumValue(card), rank: card.rank, card});
  });
  return {items, hasBuild};
}

// True if `values` (positive numbers) can be split into one or more disjoint
// groups that EACH sum exactly to `target` — e.g. [5,2,4,3] with target 7 splits
// into [5,2] and [4,3]. Cards that don't fit any group simply aren't selected.
function canPartitionExact(values, target){
  const items = values.filter(v=>v!==null && v!==undefined);
  if(items.length===0 || items.length!==values.length) return false;
  if(items.some(v=>v>target || v<=0)) return false;
  const sorted = [...items].sort((a,b)=>b-a);
  const n = sorted.length;
  const used = new Array(n).fill(false);

  function extend(afterIdx, remainingSum, remainingCount){
    if(remainingSum===0) return solve(remainingCount);
    for(let i=afterIdx+1;i<n;i++){
      if(!used[i] && sorted[i]<=remainingSum){
        used[i]=true;
        if(extend(i, remainingSum-sorted[i], remainingCount-1)) return true;
        used[i]=false;
      }
    }
    return false;
  }
  function solve(remainingCount){
    if(remainingCount===0) return true;
    let first=-1;
    for(let i=0;i<n;i++) if(!used[i]){ first=i; break; }
    if(first===-1) return true;
    used[first]=true;
    const ok = extend(first, target-sorted[first], remainingCount-1);
    used[first]=false;
    return ok;
  }
  return solve(n);
}

// Finds a build target T (2-10) such that [handCard's value, ...item values] can
// be partitioned into groups that EACH sum to T, and the player still holds
// another card of value T after playing handCard. This is what lets two loose 7s
// (each already a size-1 group at T=7) get merged into a single build of 7,
// alongside the classic arithmetic case (e.g. hand 3 + table 4 = build of 7).
//
// IMPORTANT — a build's number can never be changed by anyone once it exists.
// If the selection includes an existing build, T is locked to that build's own
// value; the hand card and any loose cards just need to form their own group(s)
// that also sum to exactly that same value alongside it. The build is only ever
// grown (more cards) or fully captured — never re-targeted to a different number.
function determineBuildTarget(handCard, items, hand){
  // Uses sumValue (not buildValue) for the hand card's own contribution — this is
  // what lets an Ace played from hand act as a 1 inside a build's arithmetic
  // (e.g. 8 + Ace = 9), while J/Q/K still can't (sumValue is null for them).
  const handValue = sumValue(handCard);
  if(handValue===null) return null;
  if(items.some(i=>i.value===null || i.value===undefined)) return null;
  const remaining = hand.filter(c=>c!==handCard);

  const buildItems = items.filter(i=>i.kind==='tableBuild');
  if(buildItems.length>0){
    // Every existing build in the selection must already share one value —
    // builds with different numbers can never be merged — and that shared
    // value is the ONLY target this move is allowed to lock onto.
    const T = buildItems[0].value;
    if(buildItems.some(b=>b.value!==T)) return null;
    const looseValues = [handValue, ...items.filter(i=>i.kind!=='tableBuild').map(i=>i.value)];
    if(canPartitionExact(looseValues, T) && remaining.some(c=>buildValue(c)===T)) return T;
    return null;
  }

  const values = [handValue, ...items.map(i=>i.value)];
  for(let T=2; T<=10; T++){
    if(canPartitionExact(values, T) && remaining.some(c=>buildValue(c)===T)) return T;
  }
  return null;
}
// Rank-based build: for a face card or Ace, any number of same-rank items (loose
// cards, raided cards, or an existing same-rank build) can be stacked together —
// no arithmetic involved, just matching rank — as long as another card of that
// rank is left in hand to capture the stack later. A rank-build's rank can't
// change either, since every included item is already required to share it.
function determineRankBuild(handCard, items, hand){
  if(!FACE_OR_ACE.has(handCard.rank)) return null;
  if(items.length===0) return null;
  if(!items.every(it=>it.rank===handCard.rank)) return null;
  const remaining = hand.filter(c=>c!==handCard);
  return remaining.some(c=>c.rank===handCard.rank) ? handCard.rank : null;
}

// Only the TOP card of a captured pile (the most recently captured one) can ever
// be raided — anything buried underneath it is off-limits.
function isTopOfCapturedPile(owner, idx){
  const pile = state.players[owner] && state.players[owner].captured;
  return !!pile && idx === pile.length - 1;
}
// Raiding can chain: after the top card is lifted, the NEXT card down becomes the
// new top and may be raided too. So a valid raid selection, per pile, is an
// unbroken run of cards starting at the very top (top, top-1, top-2 ...).
function selCapturedKeysAllTop(selCapturedKeysArr){
  const byOwner = {};
  for(const key of (selCapturedKeysArr||[])){
    const [owner, idx] = key.split('_').map(Number);
    (byOwner[owner] = byOwner[owner]||[]).push(idx);
  }
  return Object.keys(byOwner).every(owner=>{
    const pile = state.players[owner] && state.players[owner].captured;
    if(!pile) return false;
    const idxs = byOwner[owner];
    if(new Set(idxs).size!==idxs.length) return false;
    const lowest = Math.min(...idxs);
    return lowest>=0 && idxs.length===pile.length-lowest; // exactly lowest..top
  });
}
// The one card in a pile that may be tapped next to grow (or, if already the
// deepest selected, shrink) the raid run.
function nextRaidIdx(owner){
  const pile = state.players[owner].captured;
  const chosen = [...state.selCaptured].map(k=>k.split('_').map(Number)).filter(([o])=>o===owner).map(([,i])=>i);
  return chosen.length ? Math.min(...chosen)-1 : pile.length-1;
}
function deepestRaidIdx(owner){
  const chosen = [...state.selCaptured].map(k=>k.split('_').map(Number)).filter(([o])=>o===owner).map(([,i])=>i);
  return chosen.length ? Math.min(...chosen) : -1;
}

function selectionIsValidCapture(handCard, selTableIdxArr, selCapturedKeysArr){
  selCapturedKeysArr = selCapturedKeysArr||[];
  // A captured pile can NEVER be raided straight into a capture. A card must
  // first be pulled off the top of an opponent's pile by BUILDING with it —
  // only once it's part of a build on the table can it later be captured
  // (as part of that build, with no raiding involved at that point).
  if(selCapturedKeysArr.length>0) return false;
  if(selTableIdxArr.length===0 && selCapturedKeysArr.length===0) return false;
  const {items} = resolveSelection(selTableIdxArr, selCapturedKeysArr);

  if(FACE_OR_ACE.has(handCard.rank)){
    // Face cards and Aces capture exactly ONE loose card of matching rank at a
    // time — sweeping several scattered loose Kings with a single King isn't
    // allowed; multiple same-rank cards can only be captured together once
    // they've actually been built into a single pile first. Any number of
    // already-assembled same-rank builds can still be swept together, though,
    // since each is already one complete unit.
    if(items.length===0) return false;
    if(!items.every(it=>it.rank===handCard.rank)) return false;
    const looseCount = items.filter(it=>it.kind!=='tableBuild').length;
    return looseCount<=1;
  }

  const value = buildValue(handCard);
  // Any existing build(s) included must match the played value exactly — a build
  // is already a completed, fixed-value pile, so it can never be merged
  // arithmetically into a different sum, only swept up whole. Loose cards
  // (table or raided) can still combine into one or more groups alongside it,
  // e.g. an existing build of 7 plus a separate loose 7 both get captured together.
  const buildItems = items.filter(i=>i.kind==='tableBuild');
  const looseItems = items.filter(i=>i.kind!=='tableBuild');
  if(buildItems.some(b=>b.value!==value)) return false;
  const looseValues = looseItems.map(i=>i.value);
  if(looseValues.some(v=>v===null || v===undefined)) return false;
  if(looseValues.length===0) return buildItems.length>0;
  return canPartitionExact(looseValues, value);
}

function selectionIsValidBuild(handCard, selTableIdxArr, selCapturedKeysArr, hand){
  selCapturedKeysArr = selCapturedKeysArr||[];
  if(!selCapturedKeysAllTop(selCapturedKeysArr)) return false; // raided cards must be an unbroken run from the top of a pile
  if(selTableIdxArr.length===0 && selCapturedKeysArr.length===0) return false;
  const {items} = resolveSelection(selTableIdxArr, selCapturedKeysArr);
  // Try the numeric path first (covers 2-10 cards, and an Ace contributing as a 1),
  // then fall back to rank-stacking for any face card or Ace.
  if(determineBuildTarget(handCard, items, hand) !== null) return true;
  if(FACE_OR_ACE.has(handCard.rank)) return determineRankBuild(handCard, items, hand) !== null;
  return false;
}

/* ============ ACTIONS ============ */
function removeCapturedRefs(selCapturedKeysArr){
  const byOwner = {};
  (selCapturedKeysArr||[]).forEach(key=>{
    const [owner, idx] = key.split('_').map(Number);
    (byOwner[owner] = byOwner[owner]||[]).push(idx);
  });
  Object.keys(byOwner).forEach(owner=>{
    const idxs = byOwner[owner].sort((a,b)=>b-a);
    idxs.forEach(i=> state.players[owner].captured.splice(i,1));
  });
}

function performCapture(playerIdx, handCard, selTableIdxArr, selCapturedKeysArr){
  selCapturedKeysArr = selCapturedKeysArr||[];
  const player = state.players[playerIdx];
  const {items} = resolveSelection(selTableIdxArr, selCapturedKeysArr);
  // The captured table/raided cards go to the bottom of the pile; the card used
  // to make the capture goes on top, since it was the last one played.
  let capturedCards=[];
  items.forEach(it=>{
    if(it.kind==='tableBuild') capturedCards = capturedCards.concat(it.cards);
    else capturedCards.push(it.card);
  });
  capturedCards.push(handCard);

  const tableDesc = [...selTableIdxArr].sort((a,b)=>b-a);
  tableDesc.forEach(i=>state.table.splice(i,1));
  removeCapturedRefs(selCapturedKeysArr);

  player.hand = player.hand.filter(c=>c!==handCard);
  player.captured = player.captured.concat(capturedCards);
  state.lastCapturer = playerIdx;

  const raided = selCapturedKeysArr.length>0;
  state.log = `${player.name} captures ${capturedCards.length} card${capturedCards.length>1?'s':''} with ${handCard.rank}${handCard.suit}${raided?', raiding a captured pile':''}.`;
  const announceLabel = FACE_OR_ACE.has(handCard.rank) ? `${handCard.rank}s` : `${buildValue(handCard)}`;
  speak(`${announceLabel} captured`);
}
function performBuild(playerIdx, handCard, selTableIdxArr, selCapturedKeysArr){
  selCapturedKeysArr = selCapturedKeysArr||[];
  const player = state.players[playerIdx];
  const {items} = resolveSelection(selTableIdxArr, selCapturedKeysArr);
  const numericTarget = determineBuildTarget(handCard, items, player.hand);
  const isRankBuild = numericTarget===null && FACE_OR_ACE.has(handCard.rank);
  const value = numericTarget;
  const rank = isRankBuild ? determineRankBuild(handCard, items, player.hand) : null;
  let cards = [handCard];
  let extended = false;
  items.forEach(it=>{
    if(it.kind==='tableBuild'){ cards = cards.concat(it.cards); extended = true; }
    else cards.push(it.card);
  });

  const tableDesc = [...selTableIdxArr].sort((a,b)=>b-a);
  tableDesc.forEach(i=>state.table.splice(i,1));
  removeCapturedRefs(selCapturedKeysArr);

  player.hand = player.hand.filter(c=>c!==handCard);
  state.table.push({type:'build', targetValue:value, targetRank:rank, cards, owner:playerIdx});

  const raided = selCapturedKeysArr.length>0;
  const label = isRankBuild ? `a stack of ${rank}s` : `${value}`;
  let msg = `${player.name} builds ${label} using ${cards.map(c=>c.rank+c.suit).join('+')}`;
  if(extended) msg += ' (merging an existing build)';
  if(raided) msg += ', pulling cards from a captured pile';
  state.log = msg + '.';
  speak(`${isRankBuild ? rank+'s' : value} built`);
}
function performTrail(playerIdx, handCard){
  const player = state.players[playerIdx];
  player.hand = player.hand.filter(c=>c!==handCard);
  state.table.push({type:'card', card:handCard});
  state.log = `${player.name} trails ${handCard.rank}${handCard.suit}.`;
}

// A build's owner must be able to either extend it further or capture it on
// their turn. If they can do neither, it collapses immediately. If they CAN
// capture it but choose not to, it collapses at the end of that same turn —
// the cards spread back onto the table as loose cards, fair game for anyone
// (including the former owner) to use.
function buildCanExtend(playerIdx, buildIdx){
  const hand = state.players[playerIdx].hand;
  return hand.some(card=>{
    const opts = findBuildOptions(card, state.table, hand);
    return opts.some(o=>o.idxs.includes(buildIdx));
  });
}
function buildCanCapture(playerIdx, buildIdx){
  const hand = state.players[playerIdx].hand;
  return hand.some(card=>selectionIsValidCapture(card, [buildIdx], []));
}
// Lets a build's owner loudly (re-)declare it at any time, on either player's
// turn, to make sure everyone at the table has noticed it and knows it's
// coming for capture. Purely a heads-up — it doesn't use up a turn or change
// any game state besides the log/voice line.
function announceBuild(tableIdx){
  const item = state.table[tableIdx];
  if(!item || item.type!=='build' || item.owner!==0) return;
  const label = item.targetRank ? `${item.targetRank}s` : `${item.targetValue}`;
  state.log = `📢 You announce: "Building ${label}!" — I'm capturing this build.`;
  speak(`Announcing build of ${label}`);
  render();
}
function destroyBuild(buildItem, reason){
  const idx = state.table.indexOf(buildItem);
  if(idx===-1) return;
  const label = buildItem.targetRank ? `${buildItem.targetRank}s` : `${buildItem.targetValue}`;
  state.table.splice(idx, 1, ...buildItem.cards.map(c=>({type:'card', card:c})));
  state.log = `The build of ${label} breaks apart — ${reason}`;
  speak(`Build of ${label} broken apart`);
}
function evaluateForcedCapture(playerIdx){
  state.forcedCapture = null;
  const ownBuilds = state.table.filter(it=>it.type==='build' && it.owner===playerIdx);
  for(const item of ownBuilds){
    const idx = state.table.indexOf(item);
    if(idx===-1) continue;
    if(buildCanExtend(playerIdx, idx)) continue;
    if(buildCanCapture(playerIdx, idx)){
      state.forcedCapture = {owner:playerIdx, buildRef:item};
      if(playerIdx===0){
        const label = item.targetRank ? `${item.targetRank}s` : `${item.targetValue}`;
        speak(`Capture your build of ${label} now, or it breaks apart`);
      }
      return; // track the single most pressing build at a time
    } else {
      destroyBuild(item, `${state.players[playerIdx].name} has no way to extend or capture it.`);
    }
  }
}

function endTurn(){
  const actingPlayer = state.turn;
  if(state.forcedCapture && state.forcedCapture.owner===actingPlayer){
    const item = state.forcedCapture.buildRef;
    if(state.table.includes(item) && item.owner===actingPlayer){
      destroyBuild(item, `${state.players[actingPlayer].name} didn't capture it in time.`);
    }
    state.forcedCapture = null;
  }

  state.selHand=null; state.selTable=new Set(); state.selCaptured=new Set();
  dealMoreIfNeeded();
  if(state.phase==='gameover') { render(); return; }
  state.turn = nextActiveSeat(state.turn);
  evaluateForcedCapture(state.turn);
  render();
  if(state.turn===1 && !net.active && !state.tournament) setTimeout(aiTakeTurn, settings.aiThinkMs); // online/tournament: a person moves, not the AI
}
// Cycles to the next seat still in play — with active always [0,1] outside
// Tournament mode, this is exactly the old "1 - turn" toggle.
function nextActiveSeat(from){
  const seats = state.active || [0,1];
  const pos = seats.indexOf(from);
  return seats[(pos+1) % seats.length];
}

/* ============ PLAYER ACTIONS (UI) ============ */
function playerClickHand(idx){
  if(window.__sptHaptic) window.__sptHaptic('Light');
  if(state.turn!==0 || state.phase!=='playing') return;
  state.selHand = (state.selHand===idx) ? null : idx;
  state.selTable = new Set();
  state.selCaptured = new Set();
  render();
}
function playerClickTable(idx){
  if(window.__sptHaptic) window.__sptHaptic('Light');
  if(state.turn!==0 || state.phase!=='playing' || state.selHand===null) return;
  if(state.selTable.has(idx)) state.selTable.delete(idx); else state.selTable.add(idx);
  render();
}
function playerClickCaptured(ownerIdx, idx){
  if(state.turn!==0 || state.phase!=='playing' || state.selHand===null) return;
  if(ownerIdx===0) return; // you can only raid the OPPONENT's captured pile, never your own
  const key = `${ownerIdx}_${idx}`;
  if(state.selCaptured.has(key)){
    // Only the deepest picked card can be un-picked, so the run stays unbroken.
    if(idx===deepestRaidIdx(ownerIdx)) state.selCaptured.delete(key);
  } else if(idx===nextRaidIdx(ownerIdx)){
    // The top card, or the card directly beneath the ones already picked.
    state.selCaptured.add(key);
  } else return;
  render();
}
function playerCapture(){
  if(window.__sptHaptic) window.__sptHaptic('Medium');
  const hand = state.players[0].hand;
  const card = hand[state.selHand];
  const selT = [...state.selTable];
  const selC = [...state.selCaptured];
  if(!card || !selectionIsValidCapture(card, selT, selC)) return;
  if(net.active && net.role==='guest'){ netSendAction('capture'); return; }
  if(state.tournament && tnet.role==='guest'){ tSendAction('capture'); return; }
  performCapture(0, card, selT, selC);
  endTurn();
}
function playerBuild(){
  if(window.__sptHaptic) window.__sptHaptic('Light');
  const hand = state.players[0].hand;
  const card = hand[state.selHand];
  const selT = [...state.selTable];
  const selC = [...state.selCaptured];
  if(!card || !selectionIsValidBuild(card, selT, selC, hand)) return;
  if(net.active && net.role==='guest'){ netSendAction('build'); return; }
  if(state.tournament && tnet.role==='guest'){ tSendAction('build'); return; }
  performBuild(0, card, selT, selC);
  endTurn();
}
function playerTrail(){
  if(window.__sptHaptic) window.__sptHaptic('Light');
  const hand = state.players[0].hand;
  const card = hand[state.selHand];
  if(!card || state.selTable.size>0 || state.selCaptured.size>0) return;
  if(settings.confirmTrail && typeof window!=='undefined' && window.confirm){
    if(!window.confirm(`Trail ${card.rank}${card.suit} face-up without capturing?`)) return;
  }
  if(net.active && net.role==='guest'){ netSendAction('trail'); return; }
  if(state.tournament && tnet.role==='guest'){ tSendAction('trail'); return; }
  performTrail(0, card);
  endTurn();
}

/* ============ AI ============ */
// Old table-only search (rank match, single build match, single-group sum) — still
// used as a fast baseline, and as the sole path for face/ace capture matching.
function findCaptureOptions(card, table){
  const options=[];
  if(FACE_OR_ACE.has(card.rank)){
    // Any number of matching same-rank builds can be swept together (each is
    // already one complete unit), but a loose matching card can only be taken
    // one at a time — never several scattered loose cards in one sweep.
    const buildIdxs=[], looseIdxs=[];
    table.forEach((item,idx)=>{
      if(item.type==='build' && item.targetRank===card.rank) buildIdxs.push(idx);
      else if(item.type==='card' && item.card.rank===card.rank) looseIdxs.push(idx);
    });
    if(buildIdxs.length>0 || looseIdxs.length>0){
      options.push([...buildIdxs, ...looseIdxs.slice(0,1)]);
    }
    return options;
  }
  const value = buildValue(card);
  const matchingBuildIdxs = [];
  table.forEach((item,idx)=>{
    if(item.type==='build' && item.targetValue===value) matchingBuildIdxs.push(idx);
  });
  const looseIdx=[];
  table.forEach((item,idx)=>{ if(item.type==='card' && buildValue(item.card)!==null) looseIdx.push(idx); });
  const looseItems = looseIdx.map(idx=>({idx, val:buildValue(table[idx].card)}));
  const subsets = getAllSubsets(looseItems);
  const looseGroupings = [[]]; // start with "no loose cards", i.e. a pure build sweep
  subsets.forEach(subset=>{
    const sum = subset.reduce((s,i)=>s+i.val,0);
    if(sum===value) looseGroupings.push(subset.map(i=>i.idx));
  });
  // Any matching build(s) get swept alongside whichever loose grouping (including none).
  looseGroupings.forEach(looseIdxs=>{
    const combined = [...matchingBuildIdxs, ...looseIdxs];
    if(combined.length>0) options.push(combined);
  });
  return options;
}
function findBuildOptions(card, table, hand){
  const remaining = hand.filter(c=>c!==card);
  const results = [];

  // Rank-stacking option — face cards and Aces only.
  if(FACE_OR_ACE.has(card.rank) && remaining.some(c=>c.rank===card.rank)){
    const idxs=[];
    table.forEach((item,idx)=>{
      if(item.type==='card' && item.card.rank===card.rank) idxs.push(idx);
      else if(item.type==='build' && item.targetRank===card.rank) idxs.push(idx);
    });
    if(idxs.length>0) results.push({idxs});
  }

  // Numeric option — 2-10 cards, and an Ace contributing as a 1. A build's own
  // number can never change: any subset touching an existing build must lock
  // T to that build's value (and can't mix builds with different values).
  const value = sumValue(card);
  if(value!==null){
    const combIdx=[];
    table.forEach((item,idx)=>{
      if(item.type==='card' && sumValue(item.card)!==null) combIdx.push({idx, val:sumValue(item.card), isBuild:false});
      else if(item.type==='build' && item.targetValue!==null) combIdx.push({idx, val:item.targetValue, isBuild:true});
    });
    const subsets = getAllSubsets(combIdx);
    subsets.forEach(subset=>{
      const buildsInSubset = subset.filter(i=>i.isBuild);
      const looseInSubset = subset.filter(i=>!i.isBuild);
      if(buildsInSubset.length>0){
        const T = buildsInSubset[0].val;
        if(buildsInSubset.some(b=>b.val!==T)) return; // can't merge builds with different numbers
        const looseValues = [value, ...looseInSubset.map(i=>i.val)];
        if(canPartitionExact(looseValues, T) && remaining.some(c=>buildValue(c)===T)){
          results.push({idxs:subset.map(i=>i.idx)});
        }
        return;
      }
      const values = [value, ...subset.map(i=>i.val)];
      for(let T=2; T<=10; T++){
        if(canPartitionExact(values, T) && remaining.some(c=>buildValue(c)===T)){
          results.push({idxs:subset.map(i=>i.idx)});
          break;
        }
      }
    });
  }
  return results;
}

// A deck only ever has 4 cards of any given rank, so a value-based search (rather
// than enumerating every subset of a potentially large captured pile) stays fast
// no matter how big the piles get. Finds the group (subset of denominations) that
// sums exactly to `target` while using the MOST cards, respecting supply limits.
function bestGroupByCount(denomCounts, target){
  const denoms = Object.keys(denomCounts).map(Number).filter(d=>d>0 && d<=target);
  let best = null;
  function rec(i, remaining, combo, count){
    if(remaining===0){
      if(!best || count>best.count) best = {count, combo:[...combo]};
      return;
    }
    if(i>=denoms.length) return;
    const d = denoms[i];
    const maxUse = Math.min(denomCounts[d]||0, Math.floor(remaining/d));
    for(let use=maxUse; use>=0; use--){
      for(let k=0;k<use;k++) combo.push(d);
      rec(i+1, remaining-use*d, combo, count+use);
      for(let k=0;k<use;k++) combo.pop();
    }
  }
  rec(0, target, [], 0);
  return best;
}
// Only ONE card may ever be raided from a captured pile per move — table cards
// have no such limit. To enforce that cleanly, the pool searches below try the
// table-only case, then each individual raidable card added one at a time, and
// keep whichever choice (or none) captures/builds the most.
function tablePoolRefs(){
  const refs = [];
  state.table.forEach((it, idx)=>{
    if(it.type==='card'){
      const v = sumValue(it.card);
      if(v!==null) refs.push({value:v, kind:'tableCard', idx});
    }
  });
  return refs;
}
function raidCandidateRefs(raidOwners){
  // Only the top card of each pile (the most recently captured one) is ever
  // raidable — nothing buried underneath it.
  const cands = [];
  (raidOwners||[]).forEach(owner=>{
    const pile = state.players[owner].captured;
    if(pile.length===0) return;
    const idx = pile.length-1;
    const v = sumValue(pile[idx]);
    if(v!==null) cands.push({value:v, kind:'captured', owner, idx});
  });
  return cands;
}
function poolCaptureKeys(refs){
  return {
    tableIdxs: refs.filter(r=>r.kind==='tableCard').map(r=>r.idx),
    capturedKeys: refs.filter(r=>r.kind==='captured').map(r=>`${r.owner}_${r.idx}`)
  };
}
// Repeatedly pulls the biggest available group for `target` out of a fixed pool,
// stacking as many complete groups together as possible — mirrors the "5+2,
// 4+3" multi-group capture.
function multiGroupExtract(refs, target){
  const byValue = {};
  refs.forEach(r=>{ (byValue[r.value]=byValue[r.value]||[]).push(r); });
  const used = [];
  let groups = 0;
  while(true){
    const denomCounts = {};
    Object.keys(byValue).forEach(v=>{ if(byValue[v].length>0) denomCounts[v]=byValue[v].length; });
    const best = bestGroupByCount(denomCounts, target);
    if(!best || best.count===0) break;
    best.combo.forEach(v=>{ used.push(byValue[v].pop()); });
    groups++;
  }
  return used;
}
function findPoolCapture(target, raidOwners){
  const tableRefs = tablePoolRefs();
  let bestUsed = multiGroupExtract(tableRefs, target);
  raidCandidateRefs(raidOwners).forEach(cand=>{
    const used = multiGroupExtract([...tableRefs, cand], target);
    if(used.length>bestUsed.length) bestUsed = used;
  });
  if(bestUsed.length===0) return null;
  const {tableIdxs, capturedKeys} = poolCaptureKeys(bestUsed);
  return {tableIdxs, capturedKeys, cardCount: bestUsed.length};
}
function findPoolBuild(handCard, hand, raidOwners){
  const value = sumValue(handCard);
  if(value===null) return null;
  const remaining = hand.filter(c=>c!==handCard);
  const tableRefs = tablePoolRefs();
  const raidCands = raidCandidateRefs(raidOwners);
  let bestOption = null;

  function bestAddendGroup(pool, target){
    const denomCounts = {};
    pool.forEach(r=>{ denomCounts[r.value]=(denomCounts[r.value]||0)+1; });
    const best = bestGroupByCount(denomCounts, target);
    if(!best || best.count===0) return null;
    const byValue = {};
    pool.forEach(r=>{ (byValue[r.value]=byValue[r.value]||[]).push(r); });
    return best.combo.map(v=>byValue[v].pop());
  }

  // Case A: hand card + an arithmetic addend group raises the sum above its own
  // value — table cards freely, plus at most one raided card.
  for(let sum=value+1; sum<=10; sum++){
    if(!remaining.some(c=>buildValue(c)===sum)) continue;
    const target = sum - value;
    let used = bestAddendGroup(tableRefs, target);
    raidCands.forEach(cand=>{
      const withRaid = bestAddendGroup([...tableRefs, cand], target);
      if(withRaid && (!used || withRaid.length>used.length)) used = withRaid;
    });
    if(used && (!bestOption || sum>bestOption.sum)){
      const {tableIdxs, capturedKeys} = poolCaptureKeys(used);
      bestOption = {sum, tableIdxs, capturedKeys};
    }
  }

  // Case B: stack cards that already equal the hand card's own value (e.g. two
  // loose 7s) into the same build — findPoolCapture already caps raiding at one.
  if(remaining.some(c=>buildValue(c)===value)){
    const pool = findPoolCapture(value, raidOwners);
    if(pool && pool.cardCount>0 && (!bestOption || value>=bestOption.sum)){
      bestOption = {sum:value, tableIdxs:pool.tableIdxs, capturedKeys:pool.capturedKeys};
    }
  }

  return bestOption;
}

// Rank-based pool gathering: any number of matching same-rank builds (each is
// already one complete unit), plus loose matching cards — capped to at most one
// loose card total (table or raided) when gathering for a CAPTURE, since several
// scattered loose cards can't be swept together without being built first.
// Builds allow unlimited loose stacking (capLoose=false), captures don't.
function findRankPoolCapture(rank, raidOwners, capLoose){
  const buildIdxs = [];
  const looseTableIdxs = [];
  state.table.forEach((it, idx)=>{
    if(it.type==='build' && it.targetRank===rank) buildIdxs.push(idx);
    else if(it.type==='card' && it.card.rank===rank) looseTableIdxs.push(idx);
  });
  let capturedKeys = [];
  for(const owner of (raidOwners||[])){
    const pile = state.players[owner].captured;
    if(pile.length===0) continue;
    const idx = pile.length-1;
    if(pile[idx].rank===rank){ capturedKeys = [`${owner}_${idx}`]; break; }
  }
  let looseTable = looseTableIdxs;
  if(capLoose){
    looseTable = capturedKeys.length>0 ? [] : looseTableIdxs.slice(0,1);
  }
  const tableIdxs = [...buildIdxs, ...looseTable];
  if(tableIdxs.length===0 && capturedKeys.length===0) return null;
  let cardCount = capturedKeys.length;
  tableIdxs.forEach(idx=>{
    const it = state.table[idx];
    cardCount += it.type==='build' ? it.cards.length : 1;
  });
  return {tableIdxs, capturedKeys, cardCount};
}
function findRankPoolBuild(card, hand, raidOwners){
  if(!FACE_OR_ACE.has(card.rank)) return null;
  const remaining = hand.filter(c=>c!==card);
  if(!remaining.some(c=>c.rank===card.rank)) return null;
  return findRankPoolCapture(card.rank, raidOwners, false); // building allows unlimited loose stacking
}

function anyCaptureAvailable(playerIdx){
  // Captures are never sourced from a raided captured-pile card (see
  // selectionIsValidCapture) — only table cards/builds count here.
  const hand = state.players[playerIdx].hand;
  if(hand.some(card=>findCaptureOptions(card, state.table).length>0)) return true;
  return hand.some(card=>{
    if(FACE_OR_ACE.has(card.rank)) return !!findRankPoolCapture(card.rank, [], true);
    const value = buildValue(card);
    if(value===null) return false;
    return !!findPoolCapture(value, []);
  });
}

function cardScoreWeight(card){
  let w=0;
  if(card.suit==='♠') w+=1;
  if(card.rank==='A') w+=1;
  if(card.rank==='2' && card.suit==='♠') w+=1;
  if(card.rank==='10' && card.suit==='♦') w+=2;
  return w;
}

function effectiveAiDifficulty(){
  return (ui.match && ui.match.comeback && ui.match.comebackDifficulty) ? ui.match.comebackDifficulty : settings.aiDifficulty;
}
function aiTakeTurn(){
  const d = effectiveAiDifficulty();
  if(d==='easy') return aiTakeTurnEasy();
  if(d==='hard') return aiTakeTurnHard();
  return aiTakeTurnMedium();
}

function aiTakeTurnMedium(){
  if(state.phase!=='playing') return;
  const hand = state.players[1].hand;
  if(hand.length===0){ endTurn(); return; }

  // If the rival is obligated to capture its own build this turn, do that first —
  // it takes priority over any other greedy option.
  if(state.forcedCapture && state.forcedCapture.owner===1){
    const idx = state.table.indexOf(state.forcedCapture.buildRef);
    if(idx!==-1){
      const card = hand.find(c=>selectionIsValidCapture(c, [idx], []));
      if(card){ performCapture(1, card, [idx], []); endTurn(); return; }
    }
  }

  // 1) Best capture: compare the table-only search against the pooled multi-group
  // (or rank-group) search, which can also raid the human's captured pile — take
  // whichever nets more cards.
  let best=null;
  hand.forEach(card=>{
    const opts = findCaptureOptions(card, state.table);
    opts.forEach(idxs=>{
      const size = idxs.reduce((n,i)=> n + (state.table[i].type==='build'? state.table[i].cards.length : 1),0);
      if(!best || size>best.size) best={card, tableIdxs:idxs, capturedKeys:[], size};
    });
    if(FACE_OR_ACE.has(card.rank)){
      // Captures never raid a captured pile — only table cards/builds.
      const rankPool = findRankPoolCapture(card.rank, [], true);
      if(rankPool && (!best || rankPool.cardCount>best.size)){
        best = {card, tableIdxs:rankPool.tableIdxs, capturedKeys:rankPool.capturedKeys, size:rankPool.cardCount};
      }
    } else {
      const value = buildValue(card);
      if(value!==null){
        const pool = findPoolCapture(value, []);
        if(pool && (!best || pool.cardCount>best.size)){
          best = {card, tableIdxs:pool.tableIdxs, capturedKeys:pool.capturedKeys, size:pool.cardCount};
        }
      }
    }
  });
  if(best){ performCapture(1, best.card, best.tableIdxs, best.capturedKeys); endTurn(); return; }

  // 2) Best build: same comparison between table-only builds/extensions and
  // builds assembled by raiding the human's captured pile, ranked by how many
  // cards end up gathered into the stack.
  let bestBuild=null;
  hand.forEach(card=>{
    const opts = findBuildOptions(card, state.table, hand);
    opts.forEach(o=>{
      if(!bestBuild || o.idxs.length>bestBuild.itemCount) bestBuild={card, tableIdxs:o.idxs, capturedKeys:[], itemCount:o.idxs.length};
    });
    const pools = [findPoolBuild(card, hand, [0])];
    if(FACE_OR_ACE.has(card.rank)) pools.push(findRankPoolBuild(card, hand, [0]));
    pools.forEach(pool=>{
      if(pool){
        const itemCount = pool.tableIdxs.length + pool.capturedKeys.length;
        if(!bestBuild || itemCount>bestBuild.itemCount) bestBuild = {card, tableIdxs:pool.tableIdxs, capturedKeys:pool.capturedKeys, itemCount};
      }
    });
  });
  if(bestBuild){ performBuild(1, bestBuild.card, bestBuild.tableIdxs, bestBuild.capturedKeys); endTurn(); return; }

  let trailCard = hand.find(c=>!FACE_OR_ACE.has(c.rank) && buildValue(c)<=4) || hand[0];
  performTrail(1, trailCard);
  endTurn();
}

// Easy: table-only options (no raiding, no rank pooling), and a real chance to
// skip an available play so it's genuinely beatable. Trails at random.
function aiTakeTurnEasy(){
  if(state.phase!=='playing') return;
  const hand = state.players[1].hand;
  if(hand.length===0){ endTurn(); return; }

  if(state.forcedCapture && state.forcedCapture.owner===1){
    const idx = state.table.indexOf(state.forcedCapture.buildRef);
    if(idx!==-1){
      const card = hand.find(c=>selectionIsValidCapture(c, [idx], []));
      if(card){ performCapture(1, card, [idx], []); endTurn(); return; }
    }
  }

  let best=null;
  hand.forEach(card=>{
    findCaptureOptions(card, state.table).forEach(idxs=>{
      const size = idxs.reduce((n,i)=> n + (state.table[i].type==='build'? state.table[i].cards.length : 1),0);
      if(!best || size>best.size) best={card, tableIdxs:idxs, capturedKeys:[], size};
    });
  });
  if(best && Math.random()<0.65){ performCapture(1, best.card, best.tableIdxs, best.capturedKeys); endTurn(); return; }

  let bestBuild=null;
  hand.forEach(card=>{
    findBuildOptions(card, state.table, hand).forEach(o=>{
      if(!bestBuild || o.idxs.length>bestBuild.itemCount) bestBuild={card, tableIdxs:o.idxs, capturedKeys:[], itemCount:o.idxs.length};
    });
  });
  if(bestBuild && Math.random()<0.5){ performBuild(1, bestBuild.card, bestBuild.tableIdxs, bestBuild.capturedKeys); endTurn(); return; }

  const trailCard = hand[Math.floor(Math.random()*hand.length)];
  performTrail(1, trailCard);
  endTurn();
}

// Hard: same search scope as Medium, but breaks ties between equally-sized
// options by preferring the one worth more toward scoring (spades, aces,
// 2♠, 10♦), and trails the least valuable card when nothing else is available.
function aiTakeTurnHard(){
  if(state.phase!=='playing') return;
  const hand = state.players[1].hand;
  if(hand.length===0){ endTurn(); return; }

  if(state.forcedCapture && state.forcedCapture.owner===1){
    const idx = state.table.indexOf(state.forcedCapture.buildRef);
    if(idx!==-1){
      const card = hand.find(c=>selectionIsValidCapture(c, [idx], []));
      if(card){ performCapture(1, card, [idx], []); endTurn(); return; }
    }
  }

  function weightOf(tableIdxs, capturedKeys, extraCard){
    let w = extraCard ? cardScoreWeight(extraCard) : 0;
    tableIdxs.forEach(i=>{
      const it = state.table[i];
      const cards = it.type==='build' ? it.cards : [it.card];
      cards.forEach(c=>w+=cardScoreWeight(c));
    });
    capturedKeys.forEach(k=>{
      const [owner,idx] = k.split('_').map(Number);
      w += cardScoreWeight(state.players[owner].captured[idx]);
    });
    return w;
  }

  let best=null;
  function considerCapture(card, tableIdxs, capturedKeys){
    const size = tableIdxs.reduce((n,i)=> n + (state.table[i].type==='build'? state.table[i].cards.length : 1),0) + capturedKeys.length;
    const weight = weightOf(tableIdxs, capturedKeys, card);
    if(!best || size>best.size || (size===best.size && weight>best.weight)){
      best = {card, tableIdxs, capturedKeys, size, weight};
    }
  }
  hand.forEach(card=>{
    findCaptureOptions(card, state.table).forEach(idxs=>considerCapture(card, idxs, []));
    // Captures never raid a captured pile — only table cards/builds.
    if(FACE_OR_ACE.has(card.rank)){
      const rankPool = findRankPoolCapture(card.rank, [], true);
      if(rankPool) considerCapture(card, rankPool.tableIdxs, rankPool.capturedKeys);
    } else {
      const value = buildValue(card);
      if(value!==null){
        const pool = findPoolCapture(value, []);
        if(pool) considerCapture(card, pool.tableIdxs, pool.capturedKeys);
      }
    }
  });
  if(best){ performCapture(1, best.card, best.tableIdxs, best.capturedKeys); endTurn(); return; }

  let bestBuild=null;
  hand.forEach(card=>{
    findBuildOptions(card, state.table, hand).forEach(o=>{
      if(!bestBuild || o.idxs.length>bestBuild.itemCount) bestBuild={card, tableIdxs:o.idxs, capturedKeys:[], itemCount:o.idxs.length};
    });
    const pools = [findPoolBuild(card, hand, [0])];
    if(FACE_OR_ACE.has(card.rank)) pools.push(findRankPoolBuild(card, hand, [0]));
    pools.forEach(pool=>{
      if(pool){
        const itemCount = pool.tableIdxs.length + pool.capturedKeys.length;
        if(!bestBuild || itemCount>bestBuild.itemCount) bestBuild = {card, tableIdxs:pool.tableIdxs, capturedKeys:pool.capturedKeys, itemCount};
      }
    });
  });
  if(bestBuild){ performBuild(1, bestBuild.card, bestBuild.tableIdxs, bestBuild.capturedKeys); endTurn(); return; }

  const sorted = [...hand].sort((a,b)=>cardScoreWeight(a)-cardScoreWeight(b));
  performTrail(1, sorted[0]);
  endTurn();
}

/* ============ SCORING ============ */
function computeScores(){
  const p0=state.players[0], p1=state.players[1];
  function spadeCount(p){ return p.captured.filter(c=>c.suit==='♠').length; }
  function aceCount(p){ return p.captured.filter(c=>c.rank==='A').length; }
  function hasCard(p, rank, suit){ return p.captured.some(c=>c.rank===rank && c.suit===suit); }

  const s0=spadeCount(p0), s1=spadeCount(p1);
  const spadesBonus0 = s0>s1 ? 1 : 0;
  const spadesBonus1 = s1>s0 ? 1 : 0;

  const cards0=p0.captured.length, cards1=p1.captured.length;
  const cardsBonus0 = cards0>cards1 ? 3 : 0;
  const cardsBonus1 = cards1>cards0 ? 3 : 0;

  function breakdown(p, spadesBonus, cardsBonus){
    const aces = aceCount(p);
    const little = hasCard(p,'2','♠') ? 1 : 0;
    const big = hasCard(p,'10','♦') ? 2 : 0;
    const total = aces + little + big + spadesBonus + cardsBonus;
    return {aces, little, big, spadesBonus, cardsBonus, total, spades:p===p0?s0:s1, cards:p===p0?cards0:cards1};
  }
  return {
    you: breakdown(p0, spadesBonus0, cardsBonus0),
    rival: breakdown(p1, spadesBonus1, cardsBonus1)
  };
}

// ---- Tournament mode: scoring/elimination across any number of active seats.
// Fully separate from computeScores()/endGame() above, which stay exactly as
// they were for Player vs AI and Online Rooms (both always exactly 2 seats).
function computeAllScores(seatIdxs){
  const seats = seatIdxs || state.active;
  const spadeCounts = seats.map(s=>state.players[s].captured.filter(c=>c.suit==='♠').length);
  const cardCounts = seats.map(s=>state.players[s].captured.length);
  const maxSpades = Math.max(...spadeCounts);
  const maxCards = Math.max(...cardCounts);
  const spadesLeaders = spadeCounts.filter(n=>n===maxSpades).length;
  const cardsLeaders = cardCounts.filter(n=>n===maxCards).length;
  return seats.map((seat,i)=>{
    const p = state.players[seat];
    const aces = p.captured.filter(c=>c.rank==='A').length;
    const little = p.captured.some(c=>c.rank==='2' && c.suit==='♠') ? 1 : 0;
    const big = p.captured.some(c=>c.rank==='10' && c.suit==='♦') ? 2 : 0;
    // A bonus only goes to a SOLE leader — same tie rule as the 2-player game.
    const spadesBonus = (spadeCounts[i]===maxSpades && spadesLeaders===1) ? 1 : 0;
    const cardsBonus = (cardCounts[i]===maxCards && cardsLeaders===1) ? 3 : 0;
    const total = aces + little + big + spadesBonus + cardsBonus;
    return {seat, name:p.name, aces, little, big, spadesBonus, cardsBonus, total, spades:spadeCounts[i], cards:cardCounts[i]};
  });
}
// Picks who's eliminated this round: lowest total score; ties broken by fewest
// spades captured, then fewest cards captured; any further tie is broken at
// random so the tournament always keeps moving.
function tournamentPickEliminated(scores){
  let worst = scores[0];
  for(const sc of scores.slice(1)){
    if(sc.total<worst.total
      || (sc.total===worst.total && sc.spades<worst.spades)
      || (sc.total===worst.total && sc.spades===worst.spades && sc.cards<worst.cards)){
      worst = sc;
    } else if(sc.total===worst.total && sc.spades===worst.spades && sc.cards===worst.cards && Math.random()<0.5){
      worst = sc;
    }
  }
  return worst;
}

function endGame(){
  if(state.lastCapturer!==null && state.table.length>0){
    const remaining = state.table.reduce((arr,item)=> arr.concat(item.type==='card'?[item.card]:item.cards), []);
    state.players[state.lastCapturer].captured = state.players[state.lastCapturer].captured.concat(remaining);
    state.table=[];
  }
  state.phase='gameover';
  const sc = computeScores();
  if(ui.match){
    // Tally this set toward the match — ties don't add a win to either side.
    if(sc.you.total>sc.rival.total) ui.match.wins[0]++;
    else if(sc.rival.total>sc.you.total) ui.match.wins[1]++;
    ui.match.setsPlayed++;
  }
  let msg = sc.you.total===sc.rival.total ? 'Game over. It\'s a tie.'
    : (sc.you.total>sc.rival.total ? 'Game over. You win!' : 'Game over. Rival wins.');
  if(!net.active && ui.match){
    let delta = 0;
    if(ui.match.comeback){
      if(sc.you.total>sc.rival.total) delta = 100;
    } else if(ui.match.wager>0){
      if(sc.you.total>sc.rival.total) delta = ui.match.wager;
      else if(sc.rival.total>sc.you.total) delta = -ui.match.wager;
    }
    if(delta!==0) walletAdd(delta);
    ui.match.lastWalletDelta = delta;
    if(delta>0) msg += ` ${moneyFmt(delta)} to your wallet.`;
    else if(delta<0) msg += ` ${moneyFmt(delta)} from your wallet.`;
  }
  speak(msg);
}

const VT_SUIT_NAME = {'♠':'spade','♥':'heart','♦':'diamond','♣':'club'};
function cardVTName(card){
  return `card-${card.rank}-${VT_SUIT_NAME[card.suit]}`;

function cardHTML(card, extraClass=''){

      <b>Build:</b> Combine a numeric hand card with loose table cards, an existing build, and/or cards raided from a captured pile so the total is 2–10 — but only if you're still holding another card of that total's rank to capture it later. You can also stack cards that already match the target (e.g. two loose 7s) straight into the same build instead of adding them up — you'll just need a second capturing card left in hand. Face cards and Aces build the same way by rank instead of sum: two loose Kings plus a King raided from a captured pile can all be stacked together with a King from your hand, ready for your last King to sweep up later. A build's number is locked the moment it's made — nobody can ever change a build of 9 into a build of 10 or anything else. Either player can add more cards to grow it (as long as it still totals the same number) or capture it whole with the matching card, so it can pass back and forth before someone finally scoops it up, but its target never moves.<br><br>
      <b>Trail:</b> If you can't or don't want to capture or build, simply play any card face-up onto the table — there's no requirement to draw from the deck.<br><br>
      <b>Rounds:</b> Each player starts with 4 cards. Once both hands are empty, a fresh 4 cards are dealt to each player from the deck, repeating until the deck runs out — then remaining table cards go to whoever captured last. An uncaptured build isn't cleared by a redeal — it just sits there, capturable by anyone with the right card — so it's risky to leave one unclaimed for too long, since a fresh hand might hand your opponent exactly the card that steals it.<br><br>
      <b>Build deadlines:</b> Aces can join a build as a 1 (e.g. 8 + Ace = 9), on top of stacking by rank like face cards do. If you own a build and, on your turn, you have no card left that could extend it further, you're on the clock: you must capture it that same turn, or it breaks apart into loose cards on the table — free for anyone, including you, to use again. The button changes to "Add to Build" whenever your selection includes an existing build, so it's clear you're growing it rather than starting a new one.<br><br>
      <b>Scoring (7 points, 13 spades, 52 cards in play):</b> Aces = 1 pt each (4 pts total) · 2♠ = 1 pt · 10♦ = 2 pts — 7 points in all. Plus, whoever captured the most spades (out of the deck's 13) gets a bonus point, and whoever captured the most cards (out of all 52) gets a bigger bonus. Highest total wins.

/* ---- Audio unlock: some Android WebViews require an explicit resume() tied
   to a genuine user gesture before any audio will play, even after the
   Settings toggle. This catches the very first tap/click anywhere in the app
   and resumes the audio context if one exists and is still suspended. ---- */
if(typeof document!=='undefined'){
  /* iOS: WebAudio is muted by the hardware silent switch unless the page's audio
     session is 'playback'. navigator.audioSession (iOS 16.4+) fixes it directly;
     a looping silent <audio> element is the fallback for older WebKit. */
  const SILENT_WAV='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
  let silentEl=null;
  const unlockAudio = ()=>{
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
    try{
      if(!silentEl){ silentEl=new Audio(SILENT_WAV); silentEl.loop=true; silentEl.setAttribute('playsinline',''); }
      silentEl.play().catch(()=>{});
    }catch(e){}
    ensureAudioCtx();
    if(audioCtx && audioCtx.state!=='running') audioCtx.resume().catch(()=>{});
    document.removeEventListener('touchend', unlockAudio);
    document.removeEventListener('click', unlockAudio);
  };
  document.addEventListener('touchend', unlockAudio, {passive:true});
  document.addEventListener('click', unlockAudio);
  /* Returning from the background (or a phone call / Siri) leaves the context
     'suspended' or 'interrupted' on iOS - wake it back up. */
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && audioCtx && audioCtx.state!=='running') audioCtx.resume().catch(()=>{});
  });
}

/* ---- Capacitor native polish (Android + iOS) ---- */
(function initNativePolish(){
  try {
    const cap = window.Capacitor;
    const platform = (cap && cap.getPlatform) ? cap.getPlatform() : 'web';
    const isIOS = platform==='ios' || /iPhone|iPad|iPod/.test(navigator.userAgent||'') ||
                  (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    if(isIOS) document.documentElement.classList.add('ios');
    if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
    const P = cap.Plugins || {};
    const App = P.App, Haptics = P.Haptics, StatusBar = P.StatusBar;
    // Capacitor's ImpactStyle values are upper-case ('LIGHT'/'MEDIUM'/'HEAVY');
    // anything else falls back to HEAVY on iOS.
    window.__sptHaptic = function(style){
      try {
        if(Haptics && Haptics.impact) Haptics.impact({style: String(style || 'Light').toUpperCase()});
      } catch(e) {}
    };
    // Light status-bar text over the dark felt background.
    try { if(StatusBar && StatusBar.setStyle) StatusBar.setStyle({style:'DARK'}); } catch(e) {}

    // Shared "go back one level" logic. Returns true if it handled the action.
    function navBack(fromSwipe){
      if(typeof settingsOpen !== 'undefined' && settingsOpen){ toggleSettings(); return true; }
      if(typeof state !== 'undefined' && state && state.rulesOpen){ state.rulesOpen=false; render(); return true; }
      const inTourney = (typeof tnet!=='undefined' && (tnet.ws || (typeof state!=='undefined' && state && state.tournament)));
      if(typeof ui !== 'undefined' && ui && ['howto','rules','credits','online','matchSetup','tournament'].includes(ui.screen) && !inTourney){ goToMenu(); return true; }
      if(fromSwipe) return false;               // never leave a live game / tournament by accident
      if(inTourney){ tLeaveTournament(); return true; }
      if(typeof ui !== 'undefined' && ui && ui.screen==='game'){ goToMenu(); return true; }
      return false;
    }
    if(App && App.addListener){
      App.addListener('backButton', function(){ if(!navBack(false)) App.exitApp(); });
      App.addListener('appStateChange', function(st){
        if(st && st.isActive && audioCtx && audioCtx.state!=='running') audioCtx.resume().catch(()=>{});
      });
    }
    // iOS has no back button: swipe in from the left edge instead (menus only).
    if(isIOS){
      let sx=0, sy=0, tracking=false;
      document.addEventListener('touchstart', function(e){
        const t=e.touches[0]; tracking = e.touches.length===1 && t.clientX<24; sx=t.clientX; sy=t.clientY;
      }, {passive:true});
      document.addEventListener('touchend', function(e){
        if(!tracking) return; tracking=false;
        const t=e.changedTouches[0], dx=t.clientX-sx, dy=Math.abs(t.clientY-sy);
        if(dx>80 && dy<60){ if(navBack(true) && window.__sptHaptic) window.__sptHaptic('Light'); }
      }, {passive:true});
    }
  } catch(e) {}
})();

</script>
